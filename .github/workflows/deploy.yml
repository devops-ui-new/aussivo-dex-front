name: Deploy frontend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            bash /var/www/aussivo/deploy-remote.sh frontend
      - name: Verify the site loads
        run: |
          sleep 3
          code=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.PUBLIC_HOST }}/ || echo 000)
          echo "GET / -> $code"
          [ "$code" = "200" ] || { echo "Site not responding after deploy"; exit 1; }